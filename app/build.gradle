plugins {
    id 'com.android.application'
}

android {
    namespace = 'org.liberty.android.classiccalc'
    compileSdk = 36

    defaultConfig {
        applicationId = "org.liberty.android.classiccalc"
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }

    androidComponents {
        onVariants(selector().withBuildType("debug")) { variant ->
            variant.applicationId.set("org.liberty.android.classiccalcdebug")
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }

    testOptions {
        unitTests.all {
            maxParallelForks = Runtime.runtime.availableProcessors()
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
